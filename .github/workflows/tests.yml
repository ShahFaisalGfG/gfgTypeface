name: Tests

# Runs on every push and pull request, and from build-release.yml before every release. Windows,
# because the end-to-end tests measure text in fonts that ship with Windows (Georgia, Verdana,
# Courier New).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Playwright's own Chromium: branded Chrome ignores extensions loaded from the command line.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Builds .output/chrome-mv3 and runs the end-to-end tests with it loaded.
      - name: End-to-end tests
        run: npm run test:e2e
